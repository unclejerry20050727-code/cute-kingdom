<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>可愛國</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<!-- 第十三輪a：移除 Google Fonts（Long Cang/Caveat）→ 全遊戲只用本地 RHR 圓體，離線不跑版 -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════ 世界畫布 ══════════ -->
<canvas id="game-canvas"></canvas>

<!-- ══════════ 封面（佔位） ══════════ -->
<div id="screen-cover" class="screen polka">
  <div class="cover-card pop-in">
    <div class="cover-hearts">🌸 💛 🌷</div>
    <div class="cover-title">可愛國</div>
    <div class="cover-note">（封面製作中，敬請期待～）</div>
    <div class="cover-credit">BGM：Daystar ・ Lukrembo</div>
    <button class="btn btn-big" id="cover-enter">點擊進入 ✨</button>
  </div>
</div>

<!-- ══════════ 標題畫面 ══════════ -->
<div id="screen-title" class="screen polka hidden">
  <div class="title-wrap">
    <div class="title-logo">
      <span class="t-char c1">可</span><span class="t-char c2">愛</span><span class="t-char c3">國</span>
    </div>
    <div class="title-sub">小島的快樂生活</div>
    <div class="title-btns">
      <button class="btn btn-big btn-pink" id="btn-start">▶ 開始遊戲</button>
      <button class="btn btn-big btn-mint" id="btn-new">✨ 新增遊戲</button>
    </div>
    <div class="title-tip">WASD / 方向鍵移動 ・ 點點地板直接走過去</div>
  </div>
</div>

<!-- ══════════ 角色自定義 ══════════ -->
<div id="screen-create" class="screen polka hidden">
  <div class="create-wrap">
    <div class="create-preview">
      <div class="panel preview-panel">
        <div class="panel-title">✨ 長這樣 ✨</div>
        <canvas id="preview-canvas" width="340" height="400"></canvas>
        <div class="preview-name" id="preview-name">小島</div>
      </div>
    </div>
    <div class="create-panel panel">
      <div class="panel-title">🎀 做一個可愛的你</div>
      <div class="create-scroll">

        <div class="opt-group">
          <div class="opt-label">性別</div>
          <div class="opt-row" id="opt-gender">
            <button class="chip chip-big" data-val="male">👦 男生</button>
            <button class="chip chip-big" data-val="female">👧 女生</button>
          </div>
        </div>

        <div class="opt-group">
          <div class="opt-label">髮型</div>
          <div class="opt-row" id="opt-hairstyle"></div>
        </div>

        <div class="opt-group" id="group-skin"><div class="opt-label">皮膚</div><div class="opt-row swatches"></div></div>
        <div class="opt-group" id="group-hair"><div class="opt-label">頭髮</div><div class="opt-row swatches"></div></div>
        <div class="opt-group" id="group-eye"><div class="opt-label">眼睛</div><div class="opt-row swatches"></div></div>
        <div class="opt-group" id="group-nose"><div class="opt-label">鼻子</div><div class="opt-row swatches"></div></div>
        <div class="opt-group" id="group-mouth"><div class="opt-label">嘴巴</div><div class="opt-row swatches"></div></div>

        <div class="opt-group">
          <div class="opt-label">眼型</div>
          <div class="opt-row" id="opt-eyeShape"></div>
        </div>
        <div class="opt-group">
          <div class="opt-label">鼻型</div>
          <div class="opt-row" id="opt-noseShape"></div>
        </div>
        <div class="opt-group">
          <div class="opt-label">嘴型</div>
          <div class="opt-row" id="opt-mouthShape"></div>
        </div>

        <div class="opt-group">
          <div class="opt-label">衣服（上衣）</div>
          <div class="opt-row" id="opt-top"></div>
        </div>
        <div class="opt-group">
          <div class="opt-label">褲子</div>
          <div class="opt-row" id="opt-bottom"></div>
        </div>

      </div>
      <div class="create-actions">
        <button class="btn" id="create-back">← 返回</button>
        <button class="btn btn-big btn-pink" id="create-confirm">確定 ✨</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════ 遊戲畫面 UI ══════════ -->
<div id="screen-game" class="hidden">

  <div class="hud-badge" id="hud-badge">
    <span class="hud-flag">🏡 可愛國</span>
    <span class="hud-name" id="hud-name">小島</span>
  </div>

  <!-- 錢（地圖/房間/打工） -->
  <div class="hud-badge money-badge hidden" id="hud-money">
    <span class="coin"></span><span id="hud-money-val">100</span> 元
  </div>

  <!-- 地圖：回家 -->
  <button class="hud-btn map-home-btn hidden" id="map-home" title="回家">
    <span class="hud-emoji">🏠</span><span>回家</span>
  </button>

  <!-- 建造 -->
  <button class="hud-btn hidden" id="build-btn" title="建造">
    <span class="hud-emoji">🛠️</span><span>建造</span>
  </button>
  <div class="build-panel hidden" id="build-panel">
    <div class="build-tabs" id="build-tabs">
      <button class="btab" data-tab="furniture">🛏️ 家具</button>
      <button class="btab" data-tab="decor">⭐ 擺飾</button>
      <button class="btab" data-tab="wall">🖼️ 牆飾</button>
      <button class="btab" data-tab="floor">🌸 地飾</button>
      <button class="btab" data-tab="renovate">🎨 裝潢</button>
      <button class="btab" data-tab="remove">🧹 移除</button>
    </div>
    <div class="build-items" id="build-items"></div>
  </div>

  <!-- 出門 -->
  <button class="hud-btn hidden" id="out-btn" title="出門">
    <span class="hud-emoji">🚪</span><span>出門</span>
  </button>

  <!-- 方向鍵（觸控/滑鼠） -->
  <div class="dpad hidden" id="dpad">
    <button data-d="-1,-1">↑</button>
    <div class="dpad-mid">
      <button data-d="-1,1">←</button>
      <button data-d="1,-1">→</button>
    </div>
    <button data-d="1,1">↓</button>
  </div>

  <!-- 第十一輪d：放置操作鈕（觸控支援：等同 R / ↑↓ / Esc） -->
  <div class="place-actions hidden" id="place-actions">
    <button id="pa-rot" title="旋轉 90°（R）">🔄</button>
    <button id="pa-up" title="調高（↑）">▲</button>
    <button id="pa-down" title="調低（↓）">▼</button>
    <button id="pa-cancel" title="取消（Esc）">✖️</button>
  </div>

  <!-- 底部提示列 -->
  <div class="hint-bar hidden" id="hint-bar"></div>

  <!-- 對話框 -->
  <div class="dialogue hidden" id="dialogue">
    <div class="dlg-portrait"><canvas id="dlg-portrait" width="88" height="88"></canvas></div>
    <div class="dlg-main">
      <div class="dlg-name" id="dlg-name"></div>
      <div class="dlg-text" id="dlg-text"></div>
    </div>
    <div class="dlg-next" id="dlg-next">▼</div>
  </div>

  <!-- 教學箭頭圈 -->
  <div class="hint hidden" id="hint">
    <div class="hint-bubble" id="hint-label"></div>
    <div class="hint-arrow">⬇️</div>
    <div class="hint-ring"></div>
  </div>

  <!-- 點繼續 -->
  <div class="click-next hidden" id="click-next">👆 點擊繼續</div>

  <!-- 淡入淡出 -->
  <div class="fade hidden" id="fade"></div>
</div>

<!-- ══════════ Loading（手寫風・棕色系） ══════════ -->
<div id="screen-loading" class="screen polka hidden">
  <div class="loading-wrap">
    <div class="loading-circle">
      <svg class="loading-svg" viewBox="0 0 220 220" aria-hidden="true">
        <path id="ld-ring-dash" class="ld-ring-dash" fill="none" d=""></path>
        <circle class="ld-bg" cx="110" cy="110" r="80"></circle>
        <path id="ld-ring" class="ld-ring" fill="none" d=""></path>
      </svg>
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="loading-text">loading</div>
    <div class="loading-quote" id="loading-quote">好東西，都值得慢慢等。</div>
  </div>
</div>

<!-- ══════════ 麥當勞商店 ══════════ -->
<div id="screen-shop" class="screen hidden">
  <button class="scene-x" id="shop-x" title="返回地圖">✕</button>
  <div class="shop-panel pop-in">
    <div class="shop-title">麥當勞 <span class="shop-sub">· 打工小舖</span></div>
    <div class="shop-body">
      <div class="shop-items">
        <div class="shop-item">
          <canvas class="shop-icon" id="icon-uniform" width="84" height="84"></canvas>
          <div class="shop-item-name">制服</div>
          <button class="btn shop-buy" id="buy-uniform">50 元</button>
        </div>
        <div class="shop-item">
          <canvas class="shop-icon" id="icon-hat" width="84" height="84"></canvas>
          <div class="shop-item-name">帽子</div>
          <button class="btn shop-buy" id="buy-hat">30 元</button>
        </div>
      </div>
      <div class="shop-preview">
        <canvas id="shop-char-canvas" width="170" height="190"></canvas>
        <div class="shop-preview-name">打工的小島</div>
      </div>
    </div>
    <div class="shop-levels">
      <div class="shop-levels-title">🍔 選擇關卡開始打工</div>
      <div class="level-list" id="level-list"></div>
    </div>
    <div class="shop-foot">
      <div class="shop-money"><span class="coin"></span> <b id="shop-money">100</b> 元</div>
      <div class="shop-ready-msg" id="shop-ready-msg"></div>
    </div>
  </div>
</div>

<!-- ══════════ 打工（左上角 ✕ 回地圖） ══════════ -->
<div id="screen-work" class="screen hidden">
  <button class="scene-x" id="work-x" title="回地圖">✕</button>
</div>

<!-- toast -->
<div class="toast hidden" id="toast"></div>

<!-- 靜音切換 -->
<button class="mute-btn" id="btn-mute" title="聲音開/關">🔊</button>

<script src="js/util.js"></script>
<script src="js/character.js"></script>
<script src="js/world.js"></script>
<script src="js/pano.js"></script>
<script src="js/mapscene.js"></script>
<script src="js/mini.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
