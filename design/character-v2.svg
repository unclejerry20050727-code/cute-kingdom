<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="t">
  <title id="t">可愛國角色造型 v2 設計稿（參考 art/）</title>
  <!-- 座標系與遊戲 canvas 相同：腳底=(0,0)、頭心=(0,-58)、頭半徑 R=25，y 向下 -->
